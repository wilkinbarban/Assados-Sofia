name: Pull request validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, types, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA"...HEAD

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build --workspace @asados/web -- --webpack

      - name: Run hermetic tests
        run: >-
          npm run test:unit -- --allowOnly=false
          --exclude tests/unit/roles-authentication-e2e.test.ts
          --exclude tests/unit/web-client-operator-cart-flow.test.ts
